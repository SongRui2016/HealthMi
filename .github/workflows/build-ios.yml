name: Build HealthMi iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build HealthMi
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 模拟器编译（保留原样，作为参考）
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project HealthMi.xcodeproj -scheme HealthMi -sdk iphonesimulator -configuration Release build
          mkdir -p build/ios/iphonesimulator
          cp -r build/Release-iphonesimulator/HealthMi.app build/ios/iphonesimulator/

      # 真机编译 —— 不签名，只打包
      - name: Build for iOS Device
        run: |
          xcodebuild -project HealthMi.xcodeproj -scheme HealthMi -sdk iphoneos -configuration Release build CODE_SIGNING_ALLOWED=NO

      # 打包成 .ipa
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/HealthMi.app Payload/
          zip -r HealthMi.ipa Payload/
          ls -la HealthMi.ipa

      # 上传产物
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-IPA
          path: HealthMi.ipa

      - name: Upload Simulator
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-Simulator
          path: build/ios/iphonesimulator/HealthMi.app
