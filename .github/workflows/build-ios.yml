name: Build HealthMi iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build HealthMi
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔍 诊断项目信息
        run: |
          echo "=== 文件列表 ==="
          ls -la
          echo "=== Xcode 项目信息 ==="
          xcodebuild -project HealthMi.xcodeproj -list 2>&1

      - name: 🔨 编译模拟器版
        run: |
          xcodebuild \
            -project HealthMi.xcodeproj \
            -scheme HealthMi \
            -sdk iphonesimulator \
            -configuration Release \
            build

      - name: 📱 编译真机版（不签名）
        run: |
          xcodebuild \
            -project HealthMi.xcodeproj \
            -scheme HealthMi \
            -sdk iphoneos \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 打包 IPA（自动适配输出路径）
        run: |
          # 自动查找编译输出目录
          APP_PATH=""
          for dir in build/Release-iphoneos build/Release; do
            if [ -d "$dir/HealthMi.app" ]; then
              APP_PATH="$dir/HealthMi.app"
              break
            fi
          done
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 找不到 HealthMi.app"
            ls -la build/
            exit 1
          fi
          
          echo "✅ 找到应用: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HealthMi.ipa Payload/
          ls -la HealthMi.ipa

      - name: ⬆️ 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-IPA
          path: HealthMi.ipa

      - name: ⬆️ 上传模拟器包
        run: |
          mkdir -p simulator
          APP_PATH=""
          for dir in build/Release-iphonesimulator build/Release; do
            if [ -d "$dir/HealthMi.app" ]; then
              APP_PATH="$dir/HealthMi.app"
              break
            fi
          done
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" simulator/
          fi
        continue-on-error: true

      - name: 上传模拟器包
        uses: actions/upload-artifact@v4
        if: files('simulator/HealthMi.app') != ''
        with:
          name: HealthMi-iOS-Simulator
          path: simulator/HealthMi.app
