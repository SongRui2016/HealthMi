name: Build HealthMi iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build HealthMi
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build for iOS Device
        run: |
          xcodebuild \
            -project HealthMi.xcodeproj \
            -scheme HealthMi \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HealthMi.app Payload/
          zip -r HealthMi.ipa Payload/
          ls -la HealthMi.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-IPA-unsigned
          path: HealthMi.ipa
