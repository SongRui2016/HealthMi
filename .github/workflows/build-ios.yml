name: Build HealthMi iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build HealthMi
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get project info
        run: |
          xcodebuild -project HealthMi.xcodeproj -list > project-info.txt
          cat project-info.txt

      - name: Build Simulator
        run: |
          xcodebuild -project HealthMi.xcodeproj -scheme HealthMi \
            -sdk iphonesimulator -configuration Release build

      - name: Build Device (no sign)
        run: |
          xcodebuild -project HealthMi.xcodeproj -scheme HealthMi \
            -sdk iphoneos -configuration Release build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_DIR=$(find build -name "HealthMi.app" -type d | grep Release-iphoneos | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find build -name "HealthMi.app" -type d | head -1)
          fi
          [ -z "$APP_DIR" ] && echo "❌ 找不到 .app 文件" && exit 1
          
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -r HealthMi.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-IPA
          path: HealthMi.ipa

      - name: Upload Simulator
        run: |
          APP_DIR=$(find build -name "HealthMi.app" -type d | grep iphonesimulator | head -1)
          [ -n "$APP_DIR" ] && mkdir -p sim && cp -R "$APP_DIR" sim/
        continue-on-error: true

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('sim/HealthMi.app') != ''
        with:
          name: HealthMi-iOS-Simulator
          path: sim/HealthMi.app
