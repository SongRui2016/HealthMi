name: Build HealthMi iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build HealthMi
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show project structure
        run: ls -la

      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme HealthMi -sdk iphonesimulator -configuration Release build
          mkdir -p build/ios/iphonesimulator
          cp -r build/Release-iphonesimulator/HealthMi.app build/ios/iphonesimulator/ || true

      - name: Build IPA for iOS Device
        run: |
          xcodebuild -scheme HealthMi -sdk iphoneos -configuration Release build CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ios/Payload
          cp -r build/Release-iphoneos/HealthMi.app build/ios/Payload/
          cd build/ios
          zip -r HealthMi.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-IPA
          path: build/ios/HealthMi.ipa

      - name: Upload Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: HealthMi-iOS-Simulator
          path: build/ios/iphonesimulator/HealthMi.app
